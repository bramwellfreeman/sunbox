name: release

# Push a tag like v0.2.0 to build Sunbox for macOS (universal) and Linux and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output sunbox target/aarch64-apple-darwin/release/sunbox target/x86_64-apple-darwin/release/sunbox
          codesign --force --sign - sunbox
          ./sunbox --version
          tar -czf sunbox-macos-universal.tar.gz sunbox
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: sunbox-macos-universal.tar.gz }

  linux:
    # An older Ubuntu keeps the glibc requirement low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cargo build --release
          cp target/release/sunbox sunbox
          ./sunbox --version
          tar -czf sunbox-linux-x86_64.tar.gz sunbox
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: sunbox-linux-x86_64.tar.gz }

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sunbox-macos-universal.tar.gz sunbox-linux-x86_64.tar.gz install.sh \
            --title "Sunbox $GITHUB_REF_NAME" \
            --notes "Install on a Mac or Linux: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh\`"
